name: update-fish-receivers

on:
  schedule:
    - cron: "20 * * * *"  # hourly, offset from USGS :30 page build
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate receiver KML
        run: python3 scripts/generate_fish_receivers.py --test --full
      - name: Commit on change
        run: |
          git config user.name "fish-telemetry-bot"
          git config user.email "fish-telemetry-bot@users.noreply.github.com"
          git add kml data source/provenance.json
          git diff --cached --quiet || git commit -m "Hourly fish receiver update"
          git push
